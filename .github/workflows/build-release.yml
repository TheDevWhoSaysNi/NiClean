name: Build NiClean Releases

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: NiClean-Windows.zip
          - os: ubuntu-latest
            asset_name: NiClean-Linux.zip
          - os: macos-latest
            asset_name: NiClean-macOS.zip

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Force LFS pull (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git lfs install --local
          git lfs pull
          git lfs ls-files

      - name: Show first lines of exiftool.exe (debug, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Content tools\exiftool.exe -TotalCount 3

      - name: Debug list files (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          pwd
          ls -la
          echo "ASSETS:"
          ls -la assets || true

      - name: Debug list files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Location
          dir
          Write-Host "ASSETS:"
          dir assets

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==6.22.2" "customtkinter==5.2.2"

      - name: Verify tools exist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path "tools\ffmpeg.exe")) { throw "Missing tools\ffmpeg.exe" }
          if (!(Test-Path "tools\exiftool.exe")) { throw "Missing tools\exiftool.exe" }
          if (!(Test-Path "tools\exiftool_files")) { throw "Missing tools\exiftool_files" }

          # ffmpeg.exe should be almost 100MB
          if ((Get-Item "tools\ffmpeg.exe").Length -lt 1000000) {
            throw "ffmpeg.exe looks like an LFS pointer (too small)"
          }

          # exiftool.exe is a small file, detect pointer by content
          $firstLine = Get-Content "tools\exiftool.exe" -TotalCount 1
          if ($firstLine -like "version https://git-lfs.github.com/spec/v1*") {
            throw "exiftool.exe is an LFS pointer (not the real file)."
          }

          # Check if any files in exiftool_files are LFS pointers (they should all be real files)
          $pointers = Get-ChildItem tools\exiftool_files -Recurse -File |
            Select-String -Pattern "version https://git-lfs.github.com/spec/v1" -SimpleMatch -ErrorAction SilentlyContinue
          if ($pointers) { throw "Some exiftool_files appear to be LFS pointers (not fetched)." }

          dir tools
          dir tools\exiftool_files | Select-Object -First 5

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libimage-exiftool-perl
          mkdir -p tools
          cp "$(command -v ffmpeg)" tools/ffmpeg
          cp "$(command -v exiftool)" tools/exiftool
          chmod +x tools/ffmpeg tools/exiftool
          ls -la tools

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools

          # Static ffmpeg (Homebrew's ffmpeg is dynamically linked and will not
          # run on user machines that do not have the same Cellar dylibs).
          ARCH="$(uname -m)"
          if [ "$ARCH" = "arm64" ]; then
            FF_ARCH="darwin-arm64"
          else
            FF_ARCH="darwin-x64"
          fi
          curl -fsSL "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-${FF_ARCH}.gz" -o /tmp/ffmpeg.gz
          gunzip -c /tmp/ffmpeg.gz > tools/ffmpeg
          chmod +x tools/ffmpeg
          tools/ffmpeg -version | head -n 1

          # Official portable ExifTool (Perl script + lib/). Download from GitHub
          # because exiftool.org currently 404s the tarball (downloads moved).
          EXIF_VER="$(curl -fsSL https://exiftool.org/ver.txt | tr -d '[:space:]')"
          curl -fsSL "https://github.com/exiftool/exiftool/archive/refs/tags/${EXIF_VER}.tar.gz" -o /tmp/exiftool.tar.gz
          rm -rf /tmp/exiftool-extract
          mkdir -p /tmp/exiftool-extract
          tar -xzf /tmp/exiftool.tar.gz -C /tmp/exiftool-extract
          SRC="$(find /tmp/exiftool-extract -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          cp "$SRC/exiftool" tools/exiftool
          cp -R "$SRC/lib" tools/lib
          chmod +x tools/exiftool
          perl tools/exiftool -ver

          ls -la tools

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed --name NiClean `
            --collect-all customtkinter `
            --icon "assets\niclean.ico" `
            --add-data "assets\niclean.ico;assets" `
            --add-binary "tools\ffmpeg.exe;tools" `
            --add-binary "tools\exiftool.exe;tools" `
            --add-data "tools\exiftool_files;tools\exiftool_files" `
            NiClean.py

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --name NiClean \
            --collect-all customtkinter \
            --icon "assets/niclean.png" \
            --add-data "assets/niclean.png:assets" \
            --add-binary "tools/ffmpeg:tools" \
            --add-binary "tools/exiftool:tools" \
            NiClean.py

      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pyinstaller --noconfirm --windowed --name NiClean \
            --collect-all customtkinter \
            --osx-bundle-identifier com.thedevwhosaysni.niclean \
            --icon "assets/niclean.icns" \
            --add-data "assets/niclean.icns:assets" \
            --add-data "assets/niclean.png:assets" \
            --add-binary "tools/ffmpeg:tools" \
            --add-data "tools/exiftool:tools" \
            --add-data "tools/lib:tools/lib" \
            NiClean.py
          # PyInstaller already ad-hoc signs; re-sign the bundle without --deep
          # (--deep can invalidate nested Python libs and cause instant SIGKILL).
          codesign --force --sign - dist/NiClean.app
          xattr -cr dist/NiClean.app || true

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\NiClean.exe release\NiClean.exe -Force
          Compress-Archive -Path release\* -DestinationPath "${{ matrix.asset_name }}" -Force

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release
          cp dist/NiClean release/NiClean
          chmod +x release/NiClean
          (cd release && zip -r "../${{ matrix.asset_name }}" .)

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release
          cp -R dist/NiClean.app release/NiClean.app
          ditto -c -k --sequesterRsrc --keepParent release/NiClean.app "${{ matrix.asset_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/NiClean-Windows.zip
            artifacts/**/NiClean-macOS.zip
            artifacts/**/NiClean-Linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
